<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>效能測試</title>
<link rel="stylesheet" href="ui/ui.css?v=r267"><link rel="stylesheet" href="playable/slice.css?v=r267">
<style>#perf{position:absolute;z-index:20;left:8px;right:8px;top:max(8px,env(safe-area-inset-top));padding:10px 12px;border-radius:14px;background:#000c;color:#fff;font:13px/1.45 system-ui}
#perf table{width:100%;border-collapse:collapse}#perf td,#perf th{padding:2px 4px;text-align:right}#perf td:first-child,#perf th:first-child{text-align:left}
#perf button{margin:8px 6px 0 0;padding:8px 12px;border:0;border-radius:10px;background:#d9ff4f;color:#151810;font-weight:700}</style></head>
<body><div id="app"><main class="slice-shell ui-root ui-live"><canvas id="slice-canvas"></canvas></main></div><div id="perf">載入中…</div>
<script type="module">
// Test build only (Settings → 效能測試): the race renderer on a real course, running like a race for a few seconds per
// setting, each one switching one cost off, to see on the phone itself what holds the frame rate down. Per setting:
// fps, frame interval p95, JS ms per frame (simulation + draw submit), triangles and draw calls.
import {preloadPresentation,preloadModels} from './approved-assets.js?v=r267';
import {cityModels} from './approved-environment.js?v=r267';
import {ChaseRenderer} from './race-scene.js?v=r267';
import {SliceGame} from './playable/slice-game.mjs?v=r267';
import {fieldRivals} from './playable/slice-config.mjs?v=r267';
import {relayCourse} from './course/courses.mjs?v=r267';
import {raceHudMarkup,raceControlsMarkup} from './race-hud.js?v=r267';
import {PHONE} from './presentation-config.mjs?v=r267';
const out=document.getElementById('perf'),city=new URLSearchParams(location.search).get('city')||'paris',rivals=fieldRivals(5);
await Promise.all([preloadPresentation(),preloadModels(cityModels(city))]);
document.querySelector('main').insertAdjacentHTML('beforeend',raceHudMarkup(rivals)+raceControlsMarkup());
const canvas=document.querySelector('#slice-canvas'),pads=[document.querySelector('#slice-left'),document.querySelector('#slice-right')];
const game=new SliceGame({course:relayCourse(city),rivals}),R=new ChaseRenderer(canvas,{controls:pads,slice:true,city});R.prepare(game);
window.R=R;window.game=game;const gl=R.r.getContext(),dbg=gl.getExtension('WEBGL_debug_renderer_info'),gpu=dbg?gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL):'?';
const scenery=[];R.scene.traverse(o=>{if(o.isInstancedMesh)scenery.push(o);});
const overlays=[...document.querySelectorAll('.rhythm-overlay,.rhythm-note-overlay')];
const ratio=R.r.getPixelRatio();
// Each step adds one more cost switched off, so the last rows show what is left with almost nothing drawn.
const STEPS=[['手機現況',()=>{}],['解析度 1.0',()=>R.r.setPixelRatio(1)],['＋ 關影子',()=>{R.r.shadowMap.enabled=false;R.scene.traverse(o=>{if(o.material)[].concat(o.material).forEach(m=>m.needsUpdate=true);});}],
  ['＋ 拿掉路邊景物',()=>scenery.forEach(o=>o.visible=false)],['＋ 拿掉節奏點圖層',()=>overlays.forEach(c=>c.style.display='none')]];
const rows=[];let step=0,t0=0,frames=[],js=[],last=0,info={};
R.r.info.autoReset=false;   // a frame is several renders (shadow, scene): count them all
function frame(now){
  R.r.info.reset();const s=performance.now();game.advance(game.time+Math.min(.05,(now-(last||now))/1000)*1.3);R.draw(game,game.time,game.metrics());js.push(performance.now()-s);
  if(last)frames.push(now-last);last=now;info={tris:R.r.info.render.triangles,calls:R.r.info.render.calls};
  if(!t0)t0=now;
  if(now-t0>5000){   // 5 s each; the first fifth (settling) is dropped
    const f=frames.slice(Math.floor(frames.length/5)),j=js.slice(Math.floor(js.length/5)),sorted=[...f].sort((a,b)=>a-b),avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
    rows.push([STEPS[step][0],Math.round(1000/avg(f)),sorted[Math.floor(.95*(sorted.length-1))].toFixed(0),avg(j).toFixed(1),Math.round(info.tris/1000)+'k',info.calls]);
    step++;frames=[];js=[];t0=0;last=0;
    if(step>=STEPS.length){done();return;}
    STEPS[step][1]();
  }
  paint();requestAnimationFrame(frame);
}
function paint(){out.innerHTML=`<b>效能測試（${city}，五匹）</b> ${step<STEPS.length?`· 正在量：${STEPS[step][0]}…`:''}<table><tr><th>設定</th><th>fps</th><th>p95 ms</th><th>JS ms</th><th>三角形</th><th>draw</th></tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`;}
function done(){const text=JSON.stringify({perf:rows,gpu,phone:PHONE,dpr:devicePixelRatio,ratio,view:[innerWidth,innerHeight],ua:navigator.userAgent});
  paint();out.insertAdjacentHTML('beforeend',`<small>GPU ${gpu} · dpr ${devicePixelRatio} · 起始解析度 ${ratio}</small><br><button id="copy">複製結果</button><button id="back">返回</button>`);
  document.getElementById('copy').onclick=async e=>{try{await navigator.clipboard.writeText(text);e.target.textContent='已複製';}catch{prompt('複製這段',text);}};
  document.getElementById('back').onclick=()=>location.href='index.html#settings';}
game.advance(1);for(let i=0;i<3;i++)R.draw(game,game.time,game.metrics());   // warm the shaders
requestAnimationFrame(frame);
</script></body></html>
