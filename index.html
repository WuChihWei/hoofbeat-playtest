<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><meta name="theme-color" content="#15100b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="description" content="Charge, let go, dash. Raise your buddies and race the world."><title>ZOOMBUD 衝吧蹄蹄</title><link rel="icon" href="icon-192.png" type="image/png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="ui/ui.css?v=r688"><link rel="stylesheet" href="ui/ui-v2.css?v=r688"><style>html,body{margin:0;height:100%;background:#15100b}html{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}img{-webkit-user-drag:none}/* the first thing seen: the cover (2026-10-11, the user), the wordmark in its sky, the loading line at its foot */

</head><body><div id="app"></div><div class="boot" role="status"><img alt="ZOOMBUD" src="assets/ui/logo_en.webp?v=1" onerror="this.remove()"><span>Loading your buddies...</span><i><b></b></i></div><script>/* The cover is the loading page (2026-10-12, the user): it stays until the first page is drawn AND the first models are in (home.js says so: the event zb-ready, after the race's own models and the chosen city's pictures), never less than 1.5 s, never more than 6; then it fades. zb-load (detail 0…1) moves its bar. zbMark(name): a checkpoint, ms from the page's start (window.__marks; ?perf lists them on the page). */window.zbMark=function(n){(window.__marks=window.__marks||[]).push([n,Math.round(performance.now())]);if(/[?&]perf/.test(location.search)){var p=document.getElementById('zb-perf')||document.body.appendChild(Object.assign(document.createElement('pre'),{id:'zb-perf'}));p.style.cssText='position:fixed;left:6px;top:6px;z-index:200;margin:0;padding:6px 8px;border-radius:8px;background:rgba(0,0,0,.72);color:#fff;font:11px/1.35 ui-monospace,monospace;pointer-events:none;white-space:pre';p.textContent=window.__marks.map(function(m){return (m[1]/1000).toFixed(2)+'  '+m[0]}).join('\n')}};(function(){var t0=Date.now(),app=document.getElementById('app'),b=document.querySelector('.boot'),drawn=false,ready=false,gone=false;function off(){if(gone||!drawn||!ready)return;gone=true;setTimeout(function(){window.zbMark('cover off');b.style.opacity=0;b.style.pointerEvents='none';setTimeout(function(){b.remove()},600)},Math.max(0,1500-(Date.now()-t0)))}var o=new MutationObserver(function(){if(!app.children.length)return;o.disconnect();drawn=true;window.zbMark('first page');off()});o.observe(app,{childList:true});addEventListener('zb-ready',function(){ready=true;off()});addEventListener('zb-load',function(e){var i=b.querySelector('i b');if(i)i.style.width=Math.round(e.detail*100)+'%'});setTimeout(function(){ready=true;off()},6000)})();(function(){var zh;try{zh=(localStorage.getItem('hoofbeat.lang.v1')||(/^zh/i.test(navigator.language||'zh')?'zh':'en'))==='zh'}catch(e){zh=true}if(zh){var b=document.querySelector('.boot');b.querySelector('img').src='assets/ui/logo_zh.webp?v=1';b.querySelector('span').textContent='夥伴們正在集合…'}})()</script><script>/* the frame is as tall as what can be seen: in some phone browsers the page is laid out taller than the part between the browser's bars (Chrome on iOS, 2026-10-05: 46 px taller, the top or the bottom ended up under a bar). --app-h is used by home.css and slice.css; not while typing (the keyboard) or zoomed */(function(){var v=window.visualViewport;if(!v)return;function fit(){var a=document.activeElement;if(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName)||Math.abs(v.scale-1)>.01)return;document.documentElement.style.setProperty('--app-h',v.height+'px');if(v.offsetTop||window.scrollY)window.scrollTo(0,0)}fit();v.addEventListener('resize',fit);v.addEventListener('scroll',fit)})()</script><script>/* a game, not a page of text (2026-10-05, the user: on the phone a long press selected text and brought up the copy / paste bar): nothing is selectable (the style above), and no long-press / right-click menu except in a field to type in */addEventListener('contextmenu',function(e){if(!(e.target.closest&&e.target.closest('input,textarea')))e.preventDefault()})</script><script>/* boot guard: if the app never starts (a phone missing a feature), say so and show the error to screenshot */var bootErr=[];addEventListener('error',function(e){bootErr.push(e.message+' @'+(e.filename||'').split('/').pop()+':'+e.lineno)});setTimeout(function(){var b=document.querySelector('.boot');if(b)b.innerHTML='<strong>ZOOMBUD</strong><span>載入失敗，請截圖回報</span><small style="max-width:80vw;opacity:.7;font:12px system-ui">'+(bootErr.join('<br>')||navigator.userAgent)+'</small>'},15000)</script><script type="module" src="app-flow.js?v=r688"></script></body></html>
