<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><meta name="theme-color" content="#15100b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="description" content="Three buddies. One relay. One finish line. A strategy rhythm relay."><title>HOOFBEAT</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="ui/ui.css?v=r385"><link rel="stylesheet" href="ui/ui-v2.css?v=r385"><style>html,body{margin:0;height:100%;background:#15100b}html{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}img{-webkit-user-drag:none}.boot{height:100%;display:grid;place-content:center;gap:6px;color:#fff;font:600 15px system-ui;text-align:center}.boot strong{font-size:28px;letter-spacing:.1em}</style><style>/* a game, not a document: no double-tap zoom on any element (the rule on html alone did not hold everywhere), no pull-to-bounce */
*{touch-action:manipulation}html{overscroll-behavior:none}</style>
<script>for(const e of['gesturestart','gesturechange','dblclick'])document.addEventListener(e,v=>v.preventDefault(),{passive:false});   // Safari's pinch zoom, and the double click</script>
</head><body><div id="app"><div class="boot" role="status"><strong>HOOFBEAT</strong><span>Loading your buddies...</span></div></div><script>/* the frame is as tall as what can be seen: in some phone browsers the page is laid out taller than the part between the browser's bars (Chrome on iOS, 2026-10-05: 46 px taller, the top or the bottom ended up under a bar). --app-h is used by home.css and slice.css; not while typing (the keyboard) or zoomed */(function(){var v=window.visualViewport;if(!v)return;function fit(){var a=document.activeElement;if(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName)||Math.abs(v.scale-1)>.01)return;document.documentElement.style.setProperty('--app-h',v.height+'px');if(v.offsetTop||window.scrollY)window.scrollTo(0,0)}fit();v.addEventListener('resize',fit);v.addEventListener('scroll',fit)})()</script><script>/* a game, not a page of text (2026-10-05, the user: on the phone a long press selected text and brought up the copy / paste bar): nothing is selectable (the style above), and no long-press / right-click menu except in a field to type in */addEventListener('contextmenu',function(e){if(!(e.target.closest&&e.target.closest('input,textarea')))e.preventDefault()})</script><script>/* boot guard: if the app never starts (a phone missing a feature), say so and show the error to screenshot */var bootErr=[];addEventListener('error',function(e){bootErr.push(e.message+' @'+(e.filename||'').split('/').pop()+':'+e.lineno)});setTimeout(function(){var b=document.querySelector('.boot');if(b)b.innerHTML='<strong>HOOFBEAT</strong><span>載入失敗，請截圖回報</span><small style="max-width:80vw;opacity:.7;font:12px system-ui">'+(bootErr.join('<br>')||navigator.userAgent)+'</small>'},15000)</script><script type="module" src="app-flow.js?v=r385"></script></body></html>
