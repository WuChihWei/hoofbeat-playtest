<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#15100b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="description" content="Three buddies. One relay. One finish line. A strategy rhythm relay."><title>HOOFBEAT</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="ui/ui.css?v=r255"><link rel="stylesheet" href="ui/ui-v2.css?v=r255"><style>html,body{margin:0;height:100%;background:#15100b}.boot{height:100%;display:grid;place-content:center;gap:6px;color:#fff;font:600 15px system-ui;text-align:center}.boot strong{font-size:28px;letter-spacing:.1em}</style></head><body><div id="app"><div class="boot" role="status"><strong>HOOFBEAT</strong><span>Loading your buddies...</span></div></div><script>/* boot guard: if the app never starts (a phone missing a feature), say so and show the error to screenshot */var bootErr=[];addEventListener('error',function(e){bootErr.push(e.message+' @'+(e.filename||'').split('/').pop()+':'+e.lineno)});setTimeout(function(){var b=document.querySelector('.boot');if(b)b.innerHTML='<strong>HOOFBEAT</strong><span>載入失敗，請截圖回報</span><small style="max-width:80vw;opacity:.7;font:12px system-ui">'+(bootErr.join('<br>')||navigator.userAgent)+'</small>'},15000)</script><script type="module" src="app-flow.js?v=r255"></script></body></html>
